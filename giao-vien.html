<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FaceAttend · Giáo viên</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#0f1e33;--muted:#64748b;--border:#e5eaf1;--primary:#2563eb;--primary-soft:#e8effd;--green:#16a34a;--green-soft:#e5f6ec;--red:#dc2626;--red-soft:#fdecec;--amber:#d97706;--amber-soft:#fdf3e3;--r:14px;--shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06)}
[data-theme=dark]{--bg:#0c1222;--card:#121b31;--text:#e7eefb;--muted:#8ea0bf;--border:#22304d;--primary:#3b82f6;--primary-soft:#16294d;--green-soft:#123527;--red-soft:#3d1717;--amber-soft:#3a2a12}
*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:14.5px;
background:radial-gradient(600px 300px at 10% 0%,rgba(37,99,235,.10),transparent),radial-gradient(500px 260px at 95% 10%,rgba(124,58,237,.10),transparent),var(--bg)}
.header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 22px;background:var(--card);border-bottom:1px solid var(--border)}
.header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--primary),#7c3aed,transparent)}
.logo{display:flex;gap:10px;align-items:center;font-weight:800;font-size:18px}
.logo-mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--primary),#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(37,99,235,.4)}
.content{padding:22px;max-width:1000px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:10px}.muted{color:var(--muted)}.small{font-size:12.5px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.b-green{background:var(--green-soft);color:var(--green)}.b-red{background:var(--red-soft);color:var(--red)}.b-blue{background:var(--primary-soft);color:var(--primary)}.b-amber{background:var(--amber-soft);color:var(--amber)}
.avatar{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px}
.cell-main{display:flex;gap:10px;align-items:center}
.btn{background:linear-gradient(135deg,var(--primary),#1d4ed8);color:#fff;border:0;border-radius:12px;padding:9px 18px;font-weight:700;cursor:pointer;font-family:inherit;font-size:13.5px;box-shadow:0 4px 14px rgba(37,99,235,.35);transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--border);box-shadow:none}
input,select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font:inherit}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{flex:1;min-width:150px}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:8px 16px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.cam{position:relative;border-radius:var(--r);overflow:hidden;background:#0b0f1a;aspect-ratio:4/3}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.ovl{position:fixed;inset:0;background:rgba(10,18,35,.5);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px}
.lbox{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;width:440px;max-width:100%;display:grid;gap:10px}
.toast{position:fixed;bottom:18px;right:18px;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:12px;padding:11px 15px;z-index:200;box-shadow:var(--shadow)}
.empty{text-align:center;padding:36px;color:var(--muted)}
@media(max-width:700px){.content{padding:14px}}
</style>
</head>
<body>
<div class="header">
<div class="logo"><span class="logo-mark">◉</span> FaceAttend <span class="muted small">· Giáo viên</span></div>
<div><a href="index.html" class="btn ghost" style="text-decoration:none">Trang điểm danh</a>
<button class="btn ghost" onclick="toggleTheme()">Dark/Light</button></div>
</div>
<div class="content">
<div id="viewAuth"></div>
<div id="viewMain" style="display:none">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
<div><b id="hello"></b> <span class="badge b-blue">Giáo viên</span></div>
<button class="btn ghost" onclick="tLogout()">Đăng xuất</button></div>
<div class="tabs"><button id="tabS" class="on" onclick="tab('s')">Học sinh</button><button id="tabH" onclick="tab('h')">Lịch sử</button></div>
<div id="paneS">
<div class="card"><h3 style="margin-top:0">+ Thêm học sinh</h3>
<div class="toolbar" style="margin:0"><input id="t_code" placeholder="Mã HS (VD: HS001)"><input id="t_name" placeholder="Họ tên"><input id="t_cls" placeholder="Lớp (VD: 12A1)"><button class="btn" onclick="addStudent()">Thêm</button></div></div>
<div class="card" style="margin-top:16px"><h3 style="margin-top:0">Danh sách (<span id="tN">0</span>)</h3>
<table><thead><tr><th>Học sinh</th><th>Lớp</th><th>Khuôn mặt</th><th style="text-align:right">Thao tác</th></tr></thead><tbody id="ttb"></tbody></table></div>
</div>
<div id="paneH" style="display:none">
<div class="card"><div class="toolbar"><select id="hf" onchange="renderHist()"><option value="">Tất cả trạng thái</option><option>Có mặt</option><option>Đi trễ</option><option>Có phép</option></select><button class="btn ghost" onclick="exportCSV()">Xuất CSV</button></div>
<table><thead><tr><th>Ngày</th><th>Học sinh</th><th>Môn/Tiết</th><th>Giờ</th><th>Trạng thái</th></tr></thead><tbody id="htb"></tbody></table></div>
</div>
</div>
<div class="ovl" id="faceModal" style="display:none"><div class="lbox"><h3 style="margin:0">Đăng ký khuôn mặt <span id="faceWho" class="muted small"></span></h3>
<div class="cam"><video id="faceVid" autoplay muted playsinline></video></div>
<div class="toolbar" style="margin:0"><button class="btn" onclick="captureFace()">Chụp và lưu</button><button class="btn ghost" onclick="closeFaceReg()">Đóng</button></div>
<p class="small muted" style="margin:0">Nhìn thẳng, đủ sáng, bỏ khẩu trang. Ảnh chỉ lưu trên máy này.</p></div></div>
</div>
<script>
// ===== Trang giáo viên: thêm HS + khuôn mặt (cần đăng nhập) =====
document.documentElement.dataset.theme = localStorage.getItem("fa-theme") || "light";
function toggleTheme(){const t=document.documentElement.dataset.theme==="light"?"dark":"light";document.documentElement.dataset.theme=t;localStorage.setItem("fa-theme",t);}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3000);}
let S=[], ATT=[];
try{const d=JSON.parse(localStorage.getItem("fa-data")||"{}");S=d.students||[];ATT=d.attendance||[];}catch(e){}
function save(){try{localStorage.setItem("fa-data",JSON.stringify({students:S,attendance:ATT}));}catch(e){toast("Bộ nhớ máy đầy, không lưu được ảnh.");}}
const COLORS=["#2563eb","#7c3aed","#0891b2","#16a34a","#ea580c","#db2777"];
const byCode=Object.fromEntries(S.map(s=>[s.code,s]));
const av=(n,c)=>`<span class="avatar" style="background:${c}">${(n||"?").trim().split(/\s+/).slice(-2).map(w=>w[0]).join("").toUpperCase()}</span>`;
const badge=s=>s==="Có mặt"?'<span class="badge b-green">Có mặt</span>':s==="Đi trễ"?'<span class="badge b-amber">Đi trễ</span>':'<span class="badge b-blue">Có phép</span>';
// --- Tài khoản giáo viên (chỉ lưu mã băm, demo) ---
let teacher=null;
try{teacher=JSON.parse(localStorage.getItem("fa-teacher")||"null");}catch(e){}
function hash(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(16);}
function renderAuth(){
viewMain.style.display=teacher?"block":"none";
if(teacher){viewAuth.innerHTML="";hello.textContent="Xin chào, "+teacher.user+"!";renderTTB();renderHist();return;}
const stored=localStorage.getItem("fa-teacher");
viewAuth.innerHTML=`<div class="card" style="max-width:420px;margin:40px auto"><h3 style="margin-top:0">${stored?"Đăng nhập giáo viên":"Tạo tài khoản giáo viên"}</h3>
<div class="grid"><input id="t_user" placeholder="Tên đăng nhập"><input id="t_pass" type="password" placeholder="Mật khẩu">
<button class="btn" onclick="${stored?"tLogin()":"tSetup()"}">${stored?"Đăng nhập":"Tạo tài khoản"}</button></div>
<p class="small muted">${stored?"":"Lần đầu tạo tài khoản, lần sau dùng để đăng nhập. Chỉ lưu mã băm trên máy này."}</p></div>`;
}
function tSetup(){const u=t_user.value.trim(),p=t_pass.value;if(!u||!p)return toast("Nhập đủ tên đăng nhập và mật khẩu.");
const t={user:u,hash:hash(u+":"+p)};localStorage.setItem("fa-teacher",JSON.stringify(t));teacher=t;renderAuth();toast("Đã tạo tài khoản.");}
function tLogin(){const u=t_user.value.trim(),p=t_pass.value;let s=null;try{s=JSON.parse(localStorage.getItem("fa-teacher"));}catch(e){}
if(s&&s.user===u&&s.hash===hash(u+":"+p)){teacher=s;renderAuth();toast("Xin chào, "+u+"!");}else toast("Sai tài khoản hoặc mật khẩu.");}
function tLogout(){teacher=null;renderAuth();}
// --- Tabs ---
function tab(x){const s=x==="s";paneS.style.display=s?"block":"none";paneH.style.display=s?"none":"block";tabS.classList.toggle("on",s);tabH.classList.toggle("on",!s);}
// --- Học sinh ---
function addStudent(){const code=t_code.value.trim().toUpperCase(),name=t_name.value.trim(),cls=t_cls.value.trim()||"12A1";
if(!code||!name)return toast("Nhập mã và họ tên.");if(S.some(s=>s.code===code))return toast("Mã học sinh đã tồn tại.");
S.push({code,name,cls,color:COLORS[S.length%6],face:null});save();t_code.value="";t_name.value="";renderTTB();toast("Đã thêm "+name+".");}
function renderTTB(){tN.textContent=S.length;
ttb.innerHTML=S.map(s=>`<tr><td><div class="cell-main">${s.face?`<img src="${s.face}" style="width:32px;height:32px;border-radius:50%;object-fit:cover">`:av(s.name,s.color)}<div><b>${s.name}</b><div class="small muted">${s.code}</div></div></div></td><td>${s.cls}</td><td>${s.face?'<span class="badge b-green">Đã đăng ký</span>':'<span class="badge b-red">Chưa đăng ký</span>'}</td><td style="text-align:right;white-space:nowrap"><button class="btn ghost" onclick="openFaceReg('${s.code}')">${s.face?"Chụp lại":"Đăng ký"}</button> <button class="btn ghost" onclick="delStudent('${s.code}')">Xóa</button></td></tr>`).join("")||`<tr><td colspan="4"><div class="empty">📭<br><b>Chưa có học sinh</b></div></td></tr>`;}
function delStudent(code){if(!confirm("Xóa "+code+" cùng lịch sử điểm danh?"))return;
S=S.filter(s=>s.code!==code);for(let i=ATT.length-1;i>=0;i--)if(ATT[i].code===code)ATT.splice(i,1);save();renderTTB();renderHist();}
// --- Khuôn mặt ---
let faceTarget=null,faceStream=null;
async function openFaceReg(code){faceTarget=code;faceWho.textContent="· "+code;faceModal.style.display="flex";
try{faceStream=await navigator.mediaDevices.getUserMedia({video:true});faceVid.srcObject=faceStream;await faceVid.play().catch(()=>{});}catch(e){toast("Không mở được camera: "+e.message);}}
function closeFaceReg(){if(faceStream)faceStream.getTracks().forEach(t=>t.stop());faceStream=null;faceModal.style.display="none";}
function captureFace(){try{const v=faceVid,c=document.createElement("canvas");const w=96,h=Math.max(1,Math.round(96*v.videoHeight/Math.max(1,v.videoWidth)));c.width=w;c.height=h;c.getContext("2d").drawImage(v,0,0,w,h);
const s=S.find(x=>x.code===faceTarget);if(s){s.face=c.toDataURL("image/jpeg",0.7);save();toast("Đã đăng ký khuôn mặt cho "+s.name);}renderTTB();}catch(e){toast("Chụp thất bại: "+e.message);}closeFaceReg();}
// --- Lịch sử ---
function renderHist(){const f=hf.value;
htb.innerHTML=ATT.filter(a=>!f||a.status===f).slice(-200).reverse().map(a=>{const s=byCode[a.code]||{name:a.code,color:"#64748b",cls:""};return `<tr><td>${a.date}</td><td><div class="cell-main">${av(s.name,s.color)}<b>${s.name}</b></div></td><td>${a.subject||""} · Tiết ${a.period||""}</td><td>${a.time||""}</td><td>${badge(a.status)}</td></tr>`;}).join("")||`<tr><td colspan="5"><div class="empty">📭<br><b>Chưa có lượt điểm danh</b></div></td></tr>`;}
function exportCSV(){let csv="Ngay,MaHS,HoTen,Lop,Mon,Tiet,Gio,TrangThai\n";ATT.forEach(a=>{const s=byCode[a.code]||{};csv+=`${a.date},${a.code},${s.name||""},${s.cls||""},${a.subject||""},${a.period||""},${a.time||""},${a.status}\n`;});
const b=new Blob(["\ufeff"+csv],{type:"text/csv"});const u=URL.createObjectURL(b);const l=document.createElement("a");l.href=u;l.download="diemdanh.csv";l.click();}
const viewAuth=document.getElementById("viewAuth"),viewMain=document.getElementById("viewMain"),hello=document.getElementById("hello"),
tN=document.getElementById("tN"),ttb=document.getElementById("ttb"),htb=document.getElementById("htb"),hf=document.getElementById("hf"),
faceModal=document.getElementById("faceModal"),faceVid=document.getElementById("faceVid"),faceWho=document.getElementById("faceWho"),
tabS=document.getElementById("tabS"),tabH=document.getElementById("tabH"),paneS=document.getElementById("paneS"),paneH=document.getElementById("paneH");
renderAuth();
</script>
</body>
</html>
